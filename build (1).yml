name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project.yml
        id: loc
        run: |
          P=$(find . -name project.yml -not -path "./build/*" | head -n 1)
          if [ -z "$P" ]; then
            echo "找不到 project.yml，倉庫內容如下："
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ steps.loc.outputs.dir }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          xcodebuild -project FaceTracker.xcodeproj -scheme FaceTracker \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/FaceTracker.app Payload/
          zip -r FaceTracker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FaceTracker-ipa
          path: ${{ steps.loc.outputs.dir }}/FaceTracker.ipa
