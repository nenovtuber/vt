name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ] # 當 main 或 master 分支有更新時自動觸發
  workflow_dispatch:               # 允許你在網頁上手動點按鈕觸發

jobs:
  build:
    runs-on: macos-14 # 使用搭載 Apple 晶片的 M系列 Mac 雲端伺服器

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      run: |
        # 選擇內建的 Xcode 版本（目前預設最新穩定版）
        sudo xcode-select -s /Applications/Xcode.app

    # 💡 如果你的專案有使用 CocoaPods（即資料夾裡有 Podfile），請把下方兩行的 # 號拿掉
    # - name: Install CocoaPods
    #   run: pod install

    - name: Build Archive
      run: |
        # ⚠️ 請把 YourProjectName 改成你的專案名字
        # 💡 如果你是用 .xcworkspace 打包，請把下面的 -project 改成 -workspace，副檔名改成 .xcworkspace
        xcodebuild archive \
          -project YourProjectName.xcodeproj \
          -scheme YourProjectName \
          -configuration Release \
          -archivePath build/YourProjectName.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Export IPA
      run: |
        # 建立 Payload 資料夾並將 .app 打包成免簽名的 .ipa 檔案
        mkdir -p build/Payload
        cp -r build/YourProjectName.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r YourProjectName.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-package
        path: build/YourProjectName.ipa
