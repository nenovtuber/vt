name: Build IPA

on:
  push:
    branches: [ "main" ] # 每次 push 到 main 分支時，會自動觸發編譯
  pull_request:
    branches: [ "main" ] # 每次對 main 提出 PR 時，也會自動觸發編譯
  workflow_dispatch:     # 同時保留在 Actions 頁面手動點擊觸發的功能

jobs:
  build:
    runs-on: macos-latest # iOS 編譯必須在 macOS 環境下執行

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      run: |
        # 選擇最新穩定的 Xcode 版本
        sudo xcode-select -s /Applications/Xcode.app

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode Project
      run: |
        # 根據專案中的 project.yml 生成 .xcodeproj
        xcodegen generate

    - name: Build and Archive
      run: |
        # 建立放置封存檔與 IPA 的資料夾
        mkdir -p build
        
        # 自動尋找產生的專案 Target/Scheme 名稱，若找不到則預設為 FaceTracker
        SCHEME_NAME=$(xcodebuild -list -json | json Project.Targets || echo "FaceTracker")
        echo "正在編譯 Scheme: $SCHEME_NAME"

        # 進行免證書、不簽名的封存 (Unsigned Archive)
        xcodebuild archive \
          -project *.xcodeproj \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -archivePath build/FaceTracker.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA (Unsigned)
      run: |
        # 將編譯出來的 .app 檔案打包成 .ipa 格式
        mkdir -p build/Payload
        cp -r build/FaceTracker.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r FaceTracker-ipa.ipa Payload
        mv FaceTracker-ipa.ipa FaceTracker.ipa

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceTracker-ipa # README 要求的下載名稱
        path: build/FaceTracker.ipa
