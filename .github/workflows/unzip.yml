name: Auto Unzip Project

on:
  push:
    branches: [ main, master ] # 當你上傳檔案到 main 或 master 分支時觸發
  workflow_dispatch:           # 允許你在網頁上手動點擊執行

jobs:
  unzip-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✨ 這裡就是自動解壓縮的指令
    - name: Unzip your file
      run: |
        echo "正在解壓縮 app.zip..."
        unzip app.zip -d ./unzipped_content
        
    # 📝 這裡會列出解壓後的檔案，讓你在 Actions 日誌裡檢查對不對
    - name: List unzipped files
      run: |
        echo "解壓縮完成！以下是檔案列表："
        ls -R ./unzipped_content

    # 💾 新增這個步驟：將解壓後的資料夾上傳，這樣網頁上才能看到並下載檔案
    - name: Upload unzipped files
      uses: actions/upload-artifact@v4
      with:
        name: unzipped-output         # 下載時的壓縮檔名稱（可自由更改）
        path: ./unzipped_content/     # 要上傳的資料夾路徑
